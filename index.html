['Mantener una práctica espiritual diaria durante 60 días.',['10 minutos de oración, meditación o lectura estoica (Marco Aurelio, Séneca).','Siempre a la misma hora, como un ritual.'],'Si no cuidas tu interior, cualquier cosa de afuera te tumba.','Llevas 60 días seguidos con tu práctica.'],
['Escribirle una carta de perdón a alguien que me hizo daño.',['No tienes que enviarla. Escribe lo que pasó, lo que sentiste y que lo sueltas.','Al final, rómpela o quémala con cuidado si quieres cerrar el ciclo.'],'El rencor es tomar veneno esperando que el otro sufra.','La carta está escrita y sientes que pesa menos.'],
['Pasar un día entero en la naturaleza sin celular.',['Parque Chicaque, un páramo o una finca. Celular apagado en la maleta.','Lleva agua, comida y una libreta.'],'La naturaleza no tiene prisa y aun así todo lo logra.','Pasaste un día completo afuera sin usar el celular.'],
['Hacer por escrito la revisión de mi año.',['Responde: ¿qué aprendí?, ¿qué suelto?, ¿qué quiero el próximo año?','Hazlo en diciembre, en un lugar tranquilo.'],'Si no revisas el año que pasó, vas a vivir el mismo año otra vez.','Tienes la revisión escrita de este año.'],
['Ayudar a alguien sin que nadie se entere.',['Pagar un almuerzo, donar ropa o ayudar con una hoja de vida.','No lo publiques ni se lo cuentes a nadie.'],'Si lo cuentas, ya cobraste.','Lo hiciste y no se lo contaste a nadie.'],
['Pasar 24 horas en silencio: sin hablar, sin redes, sin pantallas.',['Un sábado o domingo; avísale antes a tu familia.','Camina, escribe, piensa.'],'En el silencio aparece la voz que el ruido te tapaba.','Cumpliste 24 horas en silencio.'],
['Escribir qué haría si me quedara un año de vida y empezar una de esas cosas.',['Haz la lista sin filtros.','Escoge una y da el primer paso esta misma semana.'],'Memento mori: vas a morir. ¿Qué estás esperando?','La lista está escrita y ya empezaste una de esas cosas.'],
['Escribir en una página cómo quiero ser recordado.',['Imagina que alguien habla de ti en tu funeral: ¿qué quisieras que dijera?','Revisa si lo que haces hoy va en esa dirección.'],'Tu legado se escribe hoy, no cuando seas viejo.','Tienes esa página escrita.'],
['Escribir mi historia, lo bueno y lo malo, y leerla sin vergüenza.',['Escribe los momentos que te marcaron, incluso los que duelen.','Léela en voz alta para ti.'],'Tu pasado te formó, pero no te define. Hazte cargo de lo que sigue.','Tu historia está escrita y la leíste completa.'],
['Agradecer 3 cosas cada noche durante 30 días.',['Escríbelas antes de dormir: pequeñas o grandes.','No repitas la misma dos noches seguidas.'],'El que no agradece lo que tiene, nunca va a tener suficiente.','Tienes 30 noches seguidas con tus 3 agradecimientos.']]},
{id:'negocio',name:'Negocio',emo:'💼',goals:[
['Ganar mis primeros $100.000 con algo que no dependa de mi tiempo.',['Un producto digital, una plantilla, un curso o una inversión.','Créalo una vez y véndelo muchas.'],'Si solo ganas cuando trabajas, eres esclavo de tu propio reloj.','Recibiste $100.000 de algo que ya no requiere tus horas.'],
['Tener un pitch de 30 segundos sobre mí y usarlo en la vida real.',['Quién eres, qué haces y qué valor aportas. Practícalo frente al espejo.','Úsalo en una entrevista, una reunión o un evento.'],'Si tú no sabes venderte, nadie va a comprar lo que no conoce.','Lo usaste en al menos una situación real.'],
['Delegar una tarea importante sin estar encima.',['Explica bien una sola vez y define la fecha de entrega.','Revisa solo al final.'],'Si todo pasa por ti, el límite de tu negocio eres tú.','Delegaste una tarea importante y salió sin que estuvieras encima.'],
['Lanzar algo público aunque no esté perfecto.',['Un proyecto, un video, una página, un emprendimiento.','Ponle fecha de lanzamiento y cúmplela.'],'"Perfecto" es la excusa elegante del miedo.','Lo publicaste y ya está a la vista de la gente.'],
['Cumplir mi rutina de mañana 21 días seguidos.',['Agua, 10 minutos de ejercicio, 10 de lectura y anotar tus 3 prioridades.','Nada de celular la primera media hora.'],'Gana la mañana y ganarás el día. Pierde la mañana y el día te gana a ti.','Llevas 21 días seguidos con tu rutina completa.'],
['Rechazar un cliente, trabajo o propuesta que no valía la pena.',['Mal pago, mala actitud o mucho desgaste: esas son las señales.','Di que no con respeto y sin justificarte de más.'],'Lo barato sale caro, sobre todo cuando lo que pagas es tu energía.','Rechazaste al menos una oportunidad mala.'],
['Calcular cuánto vale mi hora y negociar con ese número.',['Divide tu ingreso mensual entre las horas que trabajas en el mes.','Úsalo en tu próxima cotización o aumento.'],'Si no sabes cuánto vales, otros lo van a decidir por ti, y siempre a la baja.','Calculaste el número y lo usaste en una negociación real.'],
['Recibir mi primer ingreso pasivo.',['Intereses de un CDT, dividendos, un arriendo o ventas automáticas.','Empieza pequeño; lo importante es que llegue solo.'],'El dinero puede trabajar para ti o tú para el dinero. Tú decides.','Te llegó plata sin que trabajaras para ella ese día.'],
['Tener un fondo de emergencia de 3 meses de gastos.',['Suma tus gastos de un mes y multiplícalos por 3. Esa es tu meta.','Ahorra un porcentaje fijo cada vez que te paguen, en una cuenta aparte.'],'La tranquilidad también se ahorra.','Tienes ahorrados 3 meses de gastos y no los tocas.'],
['Publicar mi opinión o conocimiento una vez por semana durante 3 meses.',['LinkedIn, Instagram o un blog: sobre lo que sabes o lo que estás aprendiendo.','Escoge un día fijo de publicación.'],'Nadie te va a escuchar si nunca hablas.','Tienes 12 publicaciones en 12 semanas.']]},
{id:'vida',name:'Vida',emo:'✨',goals:[
['Viajar solo a otra ciudad.',['Salento, Barichara, Santa Marta o Cartagena.','Planea tú todo: ruta, hospedaje y presupuesto.'],'Viajar solo te enseña que eres tu mejor compañía.','El viaje ya pasó.'],
['Tener esa conversación incómoda que llevo aplazando.',['Usa la fórmula: "Yo siento… cuando… y necesito…".','Hazlo en persona, con calma y sin atacar.'],'Lo que no dices te enferma por dentro. Dilo.','La conversación ya pasó.'],
['Ver un amanecer desde una montaña con alguien que me inspire.',['Monserrate, la Piedra de Gacha o el mirador de La Calera.','Invita a alguien que te sume.'],'Hay momentos que no se compran. Este es uno de ellos.','Viste el amanecer y estabas acompañado.'],
['Alejarme de una relación que me hacía daño y no volver.',['Puede ser pareja, amistad o un grupo.','Cierra con respeto, sin odio, y no mires atrás.'],'Si alguien te apaga, no es tu gente. Punto.','Te alejaste y llevas 3 meses sin volver a esa dinámica.'],
['Escribirle una carta a mi yo de 40 años y guardarla.',['Qué esperas haber logrado y qué no quieres olvidar.','Guárdala en un sobre cerrado o prográmala en tu correo.'],'Tu yo de 40 años va a ser el resultado de lo que hagas hoy.','La carta está escrita y guardada.'],
['Dejar de seguir todas las cuentas que me hacen sentir menos.',['Revisa a quién sigues: si te hace compararte, dale a "dejar de seguir".','Sigue cuentas que te enseñen algo.'],'Lo que consumes te consume.','Hiciste la limpieza completa de tus redes.'],
['Escribir los 3 momentos más duros de mi vida y lo que me enseñó cada uno.',['Escribe sin juzgarte.','Al final, agradécele a esa versión de ti que lo aguantó.'],'Lo que te dolió también te hizo fuerte. No lo desperdicies.','Tienes los 3 momentos escritos, cada uno con su aprendizaje.'],
['Tener 3 amigos con los que hable de metas, no solo de fiesta.',['Propón un plan distinto: entrenar, emprender o leer juntos.','Únete a un club o comunidad de lo que te apasiona.'],'Muéstrame con quién andas y te diré a dónde vas a llegar.','Tienes 3 amigos con los que hablas de crecer y de tus metas.'],
['Aprender un hobby hasta un nivel básico real.',['Guitarra: tocar 5 canciones. Baile: bailar en público. Cocina: 5 platos.','Clases o tutoriales, 2 veces por semana.'],'Haz algo solo porque te enciende el alma, no porque dé plata.','Llegaste al nivel básico que te propusiste.'],
['Escribir mi definición de éxito en una frase y pegarla donde la vea todos los días.',['Que sea tuya, no la de tus papás ni la de Instagram.','Ponla en el espejo o de fondo de pantalla.'],'Si no defines tu éxito, vas a perseguir el de otros toda la vida.','La frase está escrita y pegada a la vista.']]},
{id:'retos',name:'Retos',emo:'🚀',goals:[
['Correr 5 km sin parar.',['Plan "de 0 a 5K": alterna 1 minuto trotando y 1 caminando, 3 veces por semana.','Cada semana suma 1 minuto más de trote.'],'Cada kilómetro es una discusión que le ganas a tu mente.','Corriste 5 km seguidos sin caminar.'],
['Levantar mi propio peso en sentadilla y en press de banca.',['Aprende la técnica con un entrenador antes de subir el peso.','Sube 2,5 kg cada dos semanas y anota tus marcas.'],'La barra no miente: o lo levantas o no. Entrena hasta que lo levantes.','Hiciste una repetición limpia con tu peso corporal en cada ejercicio.'],
['Tomar 3 meses de clases de defensa personal.',['Boxeo, jiu-jitsu o krav maga.','Dos clases por semana.'],'Saber defenderte te hace caminar distinto, y pelear menos.','Completaste 3 meses de clases.'],
['Vivir solo al menos 6 meses.',['Haz el presupuesto: arriendo, servicios, mercado y ahorro.','Aprende lo básico: cocinar, lavar y pagar a tiempo.'],'Vivir solo te muestra quién eres cuando nadie te está mirando.','Llevas 6 meses viviendo solo.'],
['Leer 30 libros que me transformen.',['Arma tu lista: hábitos, finanzas, filosofía y biografías.','Anota la fecha en que terminas cada uno.'],'Treinta libros te dan treinta mentes nuevas. Tú escoges si las quieres.','Tienes 30 libros terminados en tu lista.'],
['Mantener una conversación de 15 minutos en otro idioma.',['15 minutos diarios en una app más series con subtítulos en ese idioma.','Busca un intercambio de idiomas o un profesor.'],'Equivocarte en voz alta es el precio de aprender. Págalo.','Hablaste 15 minutos seguidos con alguien en otro idioma.'],
['Hacer mi primera inversión.',['Empieza con un CDT, un fondo de inversión o acciones.','Aprende lo básico: riesgo, plazo y rentabilidad.'],'El miedo cuesta más que el riesgo.','Tu dinero ya está invertido.'],
['Viajar solo a otro país.',['Empieza cerca: Perú, Ecuador o México.','Abre un ahorro mensual solo para ese viaje.'],'El mundo es grande y tú eres capaz. Saca ese pasaporte.','Fuiste y volviste.'],
['Hacer en público algo que me daba pena.',['Bailar, cantar, hablar o publicar un video tuyo.','Elige lo que más pena te dé. Ese es.'],'A nadie le importa tanto como crees. Y al que le importa, no paga tus cuentas.','Lo hiciste.'],
['Llegar a una cifra invertida que me dé orgullo.',['Escribe la cifra exacta, por ejemplo 5 millones.','Automatiza un porcentaje de tu sueldo cada mes.'],'Constancia más paciencia es igual a libertad.','Llegaste a la cifra que escribiste.'],
['Cocinar 5 recetas saludables sin mirar la receta.',['Pollo con verduras, arroz integral con huevo, ensalada con atún…','Aprende una por semana.'],'El que sabe cocinar para sí mismo sabe cuidarse.','Puedes hacer las 5 de memoria.'],
['Tomar una decisión importante sin pedirle permiso a nadie.',['Pide consejo si quieres, pero la última palabra es tuya.','Asume el resultado, salga como salga.'],'Tu vida, tu firma. No esperes que otro la firme por ti.','Tomaste la decisión y la sostuviste.'],
['Lograr algo importante y no presumirlo por 30 días.',['Celébralo en privado.','Deja que, si se nota, se note solo.'],'Al que hace ruido se le escucha. Al que obtiene resultados se le respeta.','Pasaron 30 días sin que lo publicaras ni lo presumieras.'],
['Corregir mi postura con 30 días de ejercicios de espalda.',['10 minutos diarios: remo, planchas y estiramientos de pecho.','Pon una alarma cada 2 horas: hombros atrás.'],'Tu postura habla antes que tú. Que diga algo bueno.','Completaste 30 días de ejercicios.'],
['Recuperarme de una lesión o un golpe emocional sin hacerme la víctima.',['Cambia "¿por qué a mí?" por "¿qué hago ahora?".','Celebra cada pequeño avance.'],'Nadie te debe nada. Levántate.','Te recuperaste y puedes contarlo sin culpar a nadie.'],
['Hablar frente a 20 personas o más.',['Una presentación del trabajo, un brindis o una exposición.','Grábate practicando antes.'],'Los nervios son energía. Úsalos.','Hablaste frente a 20 personas o más.'],
['Tener un perfil profesional con 20 publicaciones de valor.',['Define 3 temas en los que quieres ser referente.','Una publicación por semana.'],'Si no construyes tu nombre, otros lo van a definir por ti.','Tienes 20 publicaciones de valor en tu perfil.'],
['Empezar el proyecto que me da miedo y trabajarle 30 días.',['Escribe el primer paso y hazlo hoy.','30 minutos diarios durante un mes.'],'Si te da miedo, es porque importa.','Llevas 30 días trabajándole.'],
['Terminar 3 cosas que dejé a medias.',['Haz la lista de todo lo que tienes empezado.','Termina o cierra conscientemente 3 de esas cosas.'],'Empezar es fácil. Terminar es lo que te separa del resto.','Tres pendientes ya están terminados o cerrados.'],
['Salir a caminar temprano sin celular 20 días en un mes.',['20 minutos al amanecer.','El celular se queda en casa.'],'Una mañana sin pantallas te devuelve la claridad.','Caminaste 20 días en un mismo mes.'],
['Escribir mi mayor error, perdonarme y no repetirlo en 6 meses.',['Escribe qué pasó, qué aprendiste y qué harás distinto.','Háblate como le hablarías a tu mejor amigo.'],'Equivocarte una vez es aprender. Dos veces es decidir.','Pasaron 6 meses sin repetirlo.'],
['Dejar un mal hábito durante 90 días seguidos.',['Identifica qué lo dispara y reemplázalo por algo sano.','Marca en el calendario cada día que lo logres.'],'No es falta de fuerza de voluntad. Es que todavía no lo has decidido en serio.','Llevas 90 días seguidos sin ese hábito.'],
['Llamar o visitar a un familiar cada semana durante 2 meses.',['Solo para preguntar cómo está y apoyar, no para pedir nada.','Ponte un día fijo.'],'Criticar es fácil. Apoyar es de grandes.','Completaste 8 semanas seguidas.'],
['Hacer algo que mis padres nunca se atrevieron a hacer.',['Un deporte extremo, un viaje lejano o emprender.','Que te saque de lo "seguro", siempre con responsabilidad.'],'Honra a tus padres llegando más lejos de lo que ellos imaginaron.','Ya lo hiciste.'],
['Que alguien me diga que lo inspiré a cambiar algo.',['Cumple tu palabra siempre.','Comparte lo que aprendes sin predicar.'],'No digas quién eres. Demuéstralo, y otros te van a seguir.','Alguien te lo dijo directamente.']]},
{id:'domina',name:'Domina',emo:'👑',goals:[
['Habla como un abogado: defender una idea con argumentos sin perder la calma.',['En una reunión o discusión, presenta tu idea, tu argumento y tu evidencia.','Escucha al otro completo antes de responder.'],'Gana el que argumenta mejor, no el que grita más.','Defendiste una idea con argumentos y mantuviste la calma.'],
['Exprésate como un filósofo: explicar con mis palabras 5 ideas de los estoicos.',['Lee a Séneca, Marco Aurelio o Epicteto.','Escribe cada idea como si se la explicaras a un amigo.'],'Leer sin aplicar es entretenimiento, no filosofía.','Tienes escritas 5 ideas con tus propias palabras.'],
['Piensa como un científico: hacer un experimento personal de 30 días y medirlo.',['Por ejemplo: levantarte a las 5 a. m. o dejar el azúcar.','Anota cómo te sentías antes, durante y después.'],'Deja de opinar sobre tu vida. Pruébala y mide.','Completaste los 30 días y anotaste los resultados.'],
['Analiza como un psicólogo: identificar mis 3 detonantes emocionales.',['¿Qué te pone ansioso, qué te enoja y qué te hace sentir menos?','Escribe al lado de cada uno cómo vas a responder la próxima vez.'],'Si no conoces tus botones, cualquiera los va a presionar.','Tienes los 3 detonantes escritos, cada uno con su plan.'],
['Observa como un detective: leer sobre lenguaje corporal y aplicarlo en 5 conversaciones.',['Fíjate en los brazos, la mirada y hacia dónde apuntan los pies.','Anota lo que descubriste en cada conversación.'],'Los detalles que otros ignoran son tu ventaja.','Leíste sobre el tema y lo aplicaste en 5 conversaciones.'],
['Ama como un poeta: escribir una carta a mano a alguien que amo y entregarla.',['Gracias concretas, recuerdos, lo que nunca le has dicho.','Entrégala en persona.'],'Amar sin decirlo es como no haberlo dicho nunca.','La carta ya está entregada.'],
['Decide como un juez: tomar una decisión importante con pros, contras y 24 horas de espera.',['Escribe los pros y los contras.','Espera 24 horas antes de decidir.'],'Decide con calma. Ejecuta sin dudar.','Tomaste una decisión importante siguiendo ese proceso.'],
['Crea como un artista: terminar una obra propia y mostrarla.',['Una canción, un dibujo, un texto o un video.','Muéstrasela al menos a 3 personas.'],'El mundo no necesita tu idea. Necesita tu obra terminada.','Tu obra está terminada y la mostraste.'],
['Trabaja como un ingeniero: convertir una meta grande en un plan con fechas y cumplir el primer mes.',['Divide la meta en pasos pequeños, cada uno con su fecha.','Revisa el plan cada domingo.'],'Un sueño sin plan es solo un deseo.','Tienes el plan escrito y cumpliste todo lo del primer mes.']]}

const RANKS=[[0,'SOÑADOR'],[5,'MOCHILERO'],[15,'EXPLORADOR'],[30,'VIAJERO'],[45,'TROTAMUNDOS'],[60,'NÓMADA'],[75,'CIUDADANO DEL MUNDO'],[84,'SABIO VIAJERO']];
const ALL=[];CATS.forEach(c=>c.goals.forEach((g,i)=>{const id=c.id+'-'+(i+1);const n=ALL.length+1;ALL.push({id,n:c.id==='domina'?'D'+(i+1):n,t:g[0],ex:g[1],coach:g[2],crit:g[3]||'',cat:c});}));

let view='inicio',cat='cuerpo',openId=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>Math.floor((Date.now()-5*36e5)/864e5);
const pick=(a,k)=>a[((k%a.length)+a.length)%a.length];
const hash=s=>{let h=0;for(const ch of s)h=(h*31+ch.charCodeAt(0))|0;return Math.abs(h);};
const PLANE='<svg width="46" height="24" viewBox="0 0 46 24"><path d="M2 12 22 8 30 2 33 3 29 9 44 7 46 9 30 13 22 22 19 21 23 13 8 14 4 18 2 17 4 13Z" fill="#fff"/></svg>';
function fmt(iso,t){const d=new Date(iso);let s=d.toLocaleDateString('es-CO',{day:'numeric',month:'short',year:'numeric'});if(t)s+=' · '+d.toLocaleTimeString('es-CO',{hour:'numeric',minute:'2-digit'});return s;}
function sdate(iso){const d=new Date(iso);return (d.getDate()+' '+d.toLocaleDateString('es-CO',{month:'short'}).replace('.','')+' '+d.getFullYear()).toUpperCase();}
function doneList(){return Object.keys(S.done).filter(id=>BY[id]).map(id=>({g:BY[id],at:S.done[id].at,note:S.done[id].note||''})).sort((a,b)=>b.at.localeCompare(a.at));}
function stat(c){const gs=ALL.filter(g=>g.cat===c);const d=gs.filter(g=>S.done[g.id]).length;return {d,t:gs.length,full:d===gs.length};}
function rank(n){let r=RANKS[0];RANKS.forEach(x=>{if(n>=x[0])r=x});const nx=RANKS.find(x=>x[0]>n);return {r:r[1],next:nx};}
function hello(){const h=new Date().getHours();return h<5?'Viajero nocturno 🌙':h<12?'Buenos días, viajero ☀️':h<19?'Buenas tardes, viajero 🌤️':'Buenas noches, viajero 🌙';}
function render(){$('#app').innerHTML=(view==='inicio'?vInicio():view==='metas'?vMetas():vReporte())+nav();bind();}
function nav(){const b=(k,i,l)=>'<button data-nav="'+k+'" class="'+(view===k?'on':'')+'"><span>'+i+'</span>'+l+'</button>';return '<nav>'+b('inicio','🧭','Mi viaje')+b('metas','🗺️','Destinos')+b('reporte','📔','Bitácora')+'</nav>';}
function routeSvg(){let pts=CATS.map((c,i)=>{const x=18+i*44,y=44-Math.sin(i/6*Math.PI)*26;return [x,y,c]});let d='M'+pts.map(p=>p[0]+' '+p[1]).join(' L');let s='<svg viewBox="0 0 300 60"><path d="'+d+'" stroke="#F6EAD4" stroke-opacity=".5" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>';
pts.forEach(p=>{const st=stat(p[2]);const fill=st.full?'#FFD08A':st.d?'#F28C38':'#0B2545';s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="7" fill="'+fill+'" stroke="#F6EAD4" stroke-width="1.5"/>'+(st.full?'<path d="M'+(p[0]-3)+' '+p[1]+' l2 2.5 l4 -5" stroke="#0B2545" stroke-width="1.8" fill="none"/>':'')});return s+'</svg>';}
function vInicio(){const L=doneList(),tot=ALL.length,R=rank(L.length);
let h='<div class="sky"><div class="stars"></div><div class="sunc"></div><div class="plane">'+PLANE+'</div><div class="hd"><div class="hi">'+hello()+'</div><h1>Mi vida,<br><em>mi viaje por el mundo</em></h1></div><svg class="land" viewBox="0 0 400 150" preserveAspectRatio="xMidYMax slice">'+SCN.andes+'</svg></div>';
h+='<div class="pass"><div class="top"><span>PASAPORTE DE VIDA</span><button class="ed" data-hero="1">✏️ Editar</button></div><div class="nm">'+esc(S.hero.name||'Tu nombre, viajero')+'</div><div class="dr">✈️ Sueño conocer: <b>'+esc(S.hero.dream||'toca Editar y escribe tu destino soñado')+'</b></div><span class="rank">'+R.r+'</span>';
h+='<div class="route">'+routeSvg()+'<div class="lb"><span>'+L.length+' de '+tot+' sellos</span><span>'+(R.next?'Próximo nivel en '+(R.next[0]-L.length):'Nivel máximo')+'</span></div></div></div>';
const q=pick(STOIC,day());h+='<div class="wrap"><div class="quote"><div class="k">FRASE ESTOICA DEL DÍA</div><p>'+esc(q[0])+'</p><div class="a">— '+q[1]+'</div></div>';
h+='<h2>Mi ruta<small>7 destinos para conquistar tu vida</small></h2><div class="dest">';
CATS.forEach(c=>{const s=stat(c);h+='<div class="dc" data-go="'+c.id+'" style="background:'+c.grad+'">'+scene(c.m.scene)+'<div class="tx"><div class="n">'+c.m.n+'</div><div class="p">'+c.m.place+'</div></div>'+(s.full?'<div class="ok">🏅</div>':'')+'<div class="pg">'+s.d+'/'+s.t+' sellos<i><b style="width:'+(s.d/s.t*100)+'%"></b></i></div></div>'});
h+='</div><h2>Mis sellos<small>Cada objetivo cumplido queda sellado en tu pasaporte</small></h2>';
if(!L.length)h+='<div class="empty"><div style="font-size:40px">🛂</div><p><b>Tu pasaporte está en blanco… por ahora.</b><br>Cumple tu primer objetivo y recibirás tu primer sello con la fecha.</p><button class="btn sun" data-go="cuerpo">✈️ Empezar en Los Andes</button></div>';
else{h+='<div class="stamps">';L.slice(0,12).forEach((x,i)=>{const c=x.g.cat,r=(hash(x.g.id)%24)-12;h+='<div class="stp '+(i%3===1?'sq':'')+'" data-st="'+x.g.id+'" style="--r:'+r+'deg;color:'+c.color+';border-color:'+c.color+';animation-delay:'+(i*0.08)+'s"><div><div class="c">'+c.m.place.toUpperCase()+'</div><div class="ic">'+c.m.ic+'</div><div class="d">'+sdate(x.at)+'</div></div></div>'});h+='</div>';
h+='<h2>Línea del tiempo<small>Tu viaje, capítulo por capítulo</small></h2><div class="log">';L.forEach((x,i)=>{const c=x.g.cat;h+='<div class="li" style="--c:'+c.color+';animation-delay:'+(i*0.06)+'s"><div class="dt">'+sdate(x.at)+' · '+c.m.ic+' '+c.m.place.toUpperCase()+'</div><p>'+esc(x.g.t)+'</p>'+(x.note?'<div class="note">"'+esc(x.note)+'"</div>':'')+'</div>'});h+='</div>';}
return h+'</div>';}
function vMetas(){const c=CATS.find(x=>x.id===cat),m=c.m,s=stat(c);const gs=ALL.filter(g=>g.cat===c);
let h='<div class="chips">';CATS.forEach(x=>{h+='<button class="chip '+(x.id===cat?'on':'')+'" data-cat="'+x.id+'" style="'+(x.id===cat?'background:'+x.color:'')+'">'+(stat(x).full?'🏅 ':x.m.ic+' ')+x.m.place+'</button>'});
h+='</div><div class="dh" style="background:'+c.grad+'">'+scene(m.scene)+'<div class="tx"><div class="n">'+m.n+' · '+c.name.toUpperCase()+'</div><h3>'+m.place+'</h3><p>'+m.story+'</p></div><div class="bar">'+s.d+' de '+s.t+' sellos<i><b style="width:'+(s.d/s.t*100)+'%"></b></i></div></div>';
h+='<div class="sq2"><div class="k">EL ESTOICO DE ESTE DESTINO</div><p>"'+esc(m.q[0])+'"</p><div class="a">— '+m.q[1]+'</div></div>';
gs.forEach(g=>{const dn=S.done[g.id];h+='<div class="g '+(dn?'done ':'')+(openId===g.id?'open':'')+'" data-g="'+g.id+'"><div class="gh" data-tog="'+g.id+'"><div class="num" style="background:'+(dn?'#1B998B':c.grad)+'">'+(dn?'✓':g.n)+'</div><div class="gt">'+esc(g.t)+'</div><div class="chev">▾</div></div><div class="gb"><div class="gi">';
if(dn)h+='<div class="donebox"><b>🛂 SELLADO · '+fmt(dn.at,true)+'</b>'+(dn.note?'<div class="note">"'+esc(dn.note)+'"</div>':'')+'</div>';
h+='<div class="crit"><b>✅ LO MARCAS CUANDO</b>'+esc(g.crit)+'</div>';h+='<div class="lbl">ITINERARIO · EJEMPLOS</div><ul class="ex">'+g.ex.map(e=>'<li>'+esc(e)+'</li>').join('')+'</ul><div class="lbl">DIRECTO Y SIN EXCUSAS</div><div class="cq" style="background:'+c.grad+'">"'+esc(g.coach)+'"</div>';
h+=dn?'<div class="row"><button class="btn gh2" data-note="'+g.id+'">✏️ Editar nota</button><button class="btn gh2" data-undo="'+g.id+'">↩︎ Quitar sello</button></div>':'<button class="btn sun" data-done="'+g.id+'">🛂 ¡Lo logré! Sellar pasaporte</button>';
h+='</div></div></div>'});return h;}
function vReporte(){const L=doneList().slice().reverse();
let h='<div class="wrap" style="padding-top:18px"><h2 style="margin-top:4px">📔 Bitácora de viaje<small>Todo lo que has vivido, en orden</small></h2><div class="card">';
CATS.forEach(c=>{const s=stat(c);h+='<div class="cb"><div class="lab">'+c.m.ic+' '+c.m.place+'</div><div class="tr"><i style="width:'+(s.d/s.t*100)+'%;background:'+c.grad+'"></i></div><div class="v">'+s.d+'/'+s.t+'</div></div>'});
h+='</div><h2>Registro</h2>';
if(!L.length)h+='<div class="empty"><div style="font-size:40px">📔</div><p>Tu bitácora está esperando su primera página. Cada logro quedará aquí con fecha, hora y tus palabras.</p></div>';
else{L.forEach(x=>{h+='<div class="rep" style="border-left:6px solid '+x.g.cat.color+'"><div class="t">'+fmt(x.at,true)+' · '+x.g.cat.m.place+'</div><div class="q">'+esc(x.g.t)+'</div>'+(x.note?'<div class="note">"'+esc(x.note)+'"</div>':'<div style="font-size:13px;color:var(--soft)">Sin nota</div>')+'</div>'});
h+='<button class="btn" style="margin-top:6px" data-copy="1">📋 Copiar bitácora</button>';}
h+='<h2>Copia de seguridad</h2><div class="card" style="font-size:14px;color:#4b5563">Guarda tu progreso en un código y envíatelo por WhatsApp. Si cambias de celular o se borra el navegador, lo restauras aquí.<div class="row" style="margin-top:12px"><button class="btn gh2" data-bk="1">💾 Crear copia</button><button class="btn gh2" data-rs="1">♻️ Restaurar</button></div></div></div>';
return h;}
function bind(){
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{view=b.dataset.nav;render();scrollTo(0,0)});
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{cat=b.dataset.go;openId=null;view='metas';render();scrollTo(0,0)});
document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;openId=null;render()});
document.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const id=b.dataset.tog;openId=openId===id?null:id;document.querySelectorAll('.g').forEach(e=>e.classList.toggle('open',e.dataset.g===openId))});
document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>complete(b.dataset.done));
document.querySelectorAll('[data-note]').forEach(b=>b.onclick=()=>editNote(b.dataset.note));
document.querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>undo(b.dataset.undo));
document.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>showStamp(b.dataset.st));
const hb=$('[data-hero]');if(hb)hb.onclick=editHero;
const cp=$('[data-copy]');if(cp)cp.onclick=copyRep;
const bk=$('[data-bk]');if(bk)bk.onclick=()=>{const code='VIDACHECK:'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));try{navigator.clipboard.writeText(code).then(()=>toast('Copia lista: pégala en WhatsApp 💾'),()=>showTxt(code))}catch(e){showTxt(code)}};
const rs=$('[data-rs]');if(rs)rs.onclick=()=>{const o=sheet('<h3 style="font-family:var(--serif);font-size:24px;margin:0 0 8px">Restaurar progreso</h3><p style="font-size:14px;margin:0 0 8px">Pega aquí el código que empieza con VIDACHECK:</p><textarea id="rc"></textarea><div class="row" style="margin-top:10px"><button class="btn gh2" id="cx">Cancelar</button><button class="btn" id="ok">Restaurar</button></div>');o.querySelector('#cx').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{try{const v=o.querySelector('#rc').value.trim().replace(/^VIDACHECK:/,'');const n=JSON.parse(decodeURIComponent(escape(atob(v))));if(!n||!n.done)throw 0;S=n;S.hero=S.hero||{};S.last={at:Date.now(),msg:'Progreso restaurado ♻️'};o.remove();save();}catch(e){toast('Ese código no es válido')}};};}
function sheet(html){const o=document.createElement('div');o.className='ov';o.innerHTML='<div class="sheet">'+html+'</div>';o.onclick=e=>{if(e.target===o)o.remove()};document.body.appendChild(o);return o;}
function slam(c,full){const b=document.createElement('div');b.className='slam';b.innerHTML='<div class="big" style="color:'+c.color+';border-color:'+c.color+'"><div><b>'+(full?'COMPLETO':'SELLADO')+'</b><div style="font-size:34px;margin:4px 0">'+c.m.ic+'</div><span>'+c.m.place.toUpperCase()+'</span><span>'+sdate(new Date().toISOString())+'</span></div></div>';document.body.appendChild(b);setTimeout(()=>b.remove(),1750);}
function complete(id){const g=BY[id],c=g.cat,s=stat(c);const full=s.d+1===s.t;slam(c,full);
setTimeout(()=>{const q=pick(STOIC,Math.floor(Math.random()*1e4));
const o=sheet('<div class="calm"><div style="font-size:44px">'+c.m.ic+'</div><h3>'+(full?'¡Destino completado: '+c.m.place+'!':'Sello puesto en '+c.m.place)+'</h3><p>'+pick(CALM,Math.floor(Math.random()*1e4))+'</p><p style="margin-top:12px">"'+esc(q[0])+'"</p><div class="a">— '+q[1]+'</div><div class="breath">INHALA… EXHALA…</div></div><div class="lbl">'+esc(g.t)+'</div><textarea id="nt" placeholder="Escribe en tu bitácora: ¿cómo te sentiste? ¿qué aprendiste? (opcional)"></textarea><div class="row" style="margin-top:12px"><button class="btn gh2" id="cx">Aún no</button><button class="btn sun" id="ok">Guardar en mi bitácora</button></div>');
o.querySelector('#cx').onclick=()=>o.remove();
o.querySelector('#ok').onclick=()=>{S.done[id]={at:new Date().toISOString(),note:o.querySelector('#nt').value.trim()};S.last={id,at:Date.now(),msg:full?'🏅 ¡'+c.m.place+' completado!':'🛂 Sello guardado en tu pasaporte'};o.remove();save();};},1300);}
function showStamp(id){const g=BY[id],d=S.done[id],c=g.cat;const o=sheet('<div class="calm"><div style="font-size:40px">'+c.m.ic+'</div><h3>'+c.m.place+'</h3><div class="lbl" style="text-align:center">'+fmt(d.at,true)+'</div><p style="font-style:normal;font-family:var(--sans);font-weight:700">'+esc(g.t)+'</p>'+(d.note?'<div class="note" style="margin-top:12px">"'+esc(d.note)+'"</div>':'')+'</div><button class="btn gh2" id="cx">Cerrar</button>');o.querySelector('#cx').onclick=()=>o.remove();}
function editNote(id){const g=BY[id],d=S.done[id];const o=sheet('<h3 style="font-family:var(--serif);font-size:24px;margin:0 0 6px">Tu nota de viaje</h3><div class="lbl">'+esc(g.t)+'</div><textarea id="nt">'+esc(d.note||'')+'</textarea><div class="row" style="margin-top:12px"><button class="btn gh2" id="cx">Cancelar</button><button class="btn sun" id="ok">Guardar</button></div>');
o.querySelector('#cx').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{d.note=o.querySelector('#nt').value.trim();S.last={id,at:Date.now(),msg:'Nota guardada ✍️'};o.remove();save();};}
function undo(id){const g=BY[id];const o=sheet('<h3 style="font-family:var(--serif);font-size:24px;margin:0 0 6px">¿Quitar este sello?</h3><p>'+esc(g.t)+'<br><span style="color:var(--soft)">Se borrará de tu pasaporte junto con su fecha y tu nota.</span></p><div class="row"><button class="btn gh2" id="cx">No, dejarlo</button><button class="btn" id="ok">Sí, quitar</button></div>');
o.querySelector('#cx').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{delete S.done[id];S.last={id,at:Date.now(),msg:'Sello quitado'};o.remove();save();};}
function editHero(){const o=sheet('<h3 style="font-family:var(--serif);font-size:24px;margin:0 0 10px">Tu pasaporte</h3><div class="lbl">NOMBRE DEL VIAJERO</div><input id="hn" maxlength="30" placeholder="Ej: Michael Mateo" value="'+esc(S.hero.name)+'"><div class="lbl" style="margin-top:12px">EL LUGAR QUE SUEÑO CONOCER</div><input id="hd" maxlength="50" placeholder="Ej: Japón, Grecia, Islandia…" value="'+esc(S.hero.dream)+'"><div class="row" style="margin-top:14px"><button class="btn gh2" id="cx">Cancelar</button><button class="btn sun" id="ok">Guardar</button></div>');
o.querySelector('#cx').onclick=()=>o.remove();o.querySelector('#ok').onclick=()=>{S.hero={name:o.querySelector('#hn').value.trim(),dream:o.querySelector('#hd').value.trim()};S.last={at:Date.now(),msg:'Pasaporte actualizado ✈️'};o.remove();save();};}
function copyRep(){const L=doneList().slice().reverse();let t='MI VIDA EN CHECK — Bitácora de '+(S.hero.name||'viajero')+'\nNivel: '+rank(L.length).r+' · '+L.length+' de '+ALL.length+' sellos\n\n';L.forEach(x=>{t+='🛂 '+fmt(x.at,true)+' ['+x.g.cat.m.place+'] '+x.g.t+(x.note?'\n   "'+x.note+'"':'')+'\n'});
try{navigator.clipboard.writeText(t).then(()=>toast('Bitácora copiada 📋'),()=>showTxt(t))}catch(e){showTxt(t)}}
function showTxt(t){const o=sheet('<h3 style="font-family:var(--serif);font-size:24px;margin:0 0 8px">Copia esto</h3><p style="font-size:14px;margin:0 0 8px">Mantén presionado para seleccionar y copiar.</p><textarea style="min-height:260px">'+esc(t)+'</textarea><button class="btn gh2" id="cx" style="margin-top:10px">Cerrar</button>');o.querySelector('#cx').onclick=()=>o.remove();}
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),3800);}
function buildDoc(){const st=JSON.stringify(S).replace(/</g,'\\u003c');
return '<!DOCTYPE html>\n<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mi Vida en Check</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=DM+Sans:wght@400;500;700&family=Special+Elite&display=swap"><style id="st">'+STYLE+'</style></head><body><div id="app"></div><'+SC+' id="state" type="application/json">'+st+'</'+SC+'><'+SC+' id="app-js">'+APPJS+'</'+SC+'></body></html>';}
async function save(){S.updatedAt=Date.now();try{localStorage.setItem('vidaCheck',JSON.stringify(S))}catch(e){}
try{sessionStorage.setItem('vidaView',JSON.stringify({view,cat,openId}))}catch(e){}
if(ART){const sv=document.createElement('div');sv.className='saving';sv.innerHTML='<div><div class="pl">✈️</div><br>Guardando tu viaje…</div>';document.body.appendChild(sv);
try{await ART.publish(buildDoc());return;}catch(e){sv.remove();toast('Guardado en este celular 📱');}}
else toast(S.last&&S.last.msg||'Guardado');
render();}
try{const v=JSON.parse(sessionStorage.getItem('vidaView')||'null');if(v){view=v.view||view;cat=v.cat||cat;openId=v.openId||null;sessionStorage.removeItem('vidaView');}}catch(e){}
render();
try{if(S.last&&Date.now()-S.last.at<90000){const k='toast'+S.last.at;if(!sessionStorage.getItem(k)){sessionStorage.setItem(k,'1');toast(S.last.msg)}}}catch(e){}
})();
</script></body></html>
